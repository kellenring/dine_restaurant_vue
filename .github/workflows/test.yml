name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit + component + integration tests (with coverage)
        run: npm run test:report

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "reports/coverage/coverage-summary.json";
            const out = ["", "## 覆蓋率", ""];
            if (!fs.existsSync(file)) {
              out.push("測試失敗，沒有產生覆蓋率。");
            } else {
              const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
              out.push("| 項目 | 覆蓋率 | 已覆蓋 / 總數 |", "| --- | --- | --- |");
              for (const k of ["statements", "branches", "functions", "lines"]) {
                out.push(`| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`);
              }
            }
            out.push("", "完整 HTML 報告請在本頁下方 Artifacts 下載（test-report、coverage-report）。");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage
